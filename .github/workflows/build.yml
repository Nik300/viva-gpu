name: build

# Builds the Viva Metal driver: Mesa for macOS (host tools + tests on llvmpipe), then the iOS 16 arm64 bundle
# (VivaMTLDriver.bundle) and the phone test binaries with the runner's Xcode / iOS SDK.
on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 120
    env:
      JOBS: 3
    steps:
      - uses: actions/checkout@v4

      - name: Tools
        run: |
          brew install llvm spirv-llvm-translator spirv-tools zstd pkgconf || true
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
          "$(brew --prefix llvm)/bin/llvm-config" --version

      - name: Cache Mesa source
        uses: actions/cache@v4
        with:
          path: mesa/src
          key: mesa-src-${{ hashFiles('mesa/build.sh', 'mesa/patches/*.patch') }}

      - name: Mesa (macOS, host tools + llvmpipe)
        run: bash mesa/build.sh macos

      - name: Tests on the Mac (llvmpipe, Panfrost on the vgpu mock)
        continue-on-error: true
        run: |
          make -C vgpu test
          make -C driver all metal
          make -C driver test
          cd driver
          for t in phase1 phase3 translate uploads compute; do echo "== $t"; out/macos/$t | tail -3 || true; done
          out/macos/airnir ../shim/tests/corpus/apps.metal | tail -1
          VMG_DRIVER=panfrost VGPU_BACKEND=mock out/macos/airnir ../shim/tests/corpus/apps.metal | tail -1

      - name: iOS (Mesa Panfrost-only, VivaMTLDriver.bundle, phone tests)
        run: bash ios/build.sh all

      - name: Package
        if: always()
        run: |
          mkdir -p dist
          [ -d ios/out/VivaMTLDriver.bundle ] && cp -R ios/out/VivaMTLDriver.bundle dist/
          [ -d ios/out/tests ] && cp -R ios/out/tests dist/
          ls -laR dist | head -50

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: viva-gpu-ios
          path: dist
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: logs
          path: |
            mesa/build-ios/meson-logs
            mesa/build-macos/meson-logs
          retention-days: 7
