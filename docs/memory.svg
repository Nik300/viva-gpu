 ><rect x="70" y="264" width="308" height="120" rx="8" stroke="#1a73e8" fill="#e8f0fe" style="stroke-width:2;" /></g><text x="224" y="307" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:15px"><tspan x="224" dy="0">GPU address space</tspan><tspan x="224" dy="16">[32 MiB, 4 GiB), 4 KiB granule</tspan><tspan x="224" dy="16">4 PTEs per 16 KiB XNU page</tspan><tspan x="224" dy="16">bound to a hardware AS slot on demand</tspan></text></g><g class="Ym9zLmJv kern"><g class="shape" ><rect x="715" y="62" width="218" height="109" rx="8" stroke="#c5221f" fill="#fce8e6" style="stroke-width:2;" /></g><text x="824" y="99.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:15px"><tspan x="824" dy="0">CREATE_BO</tspan><tspan x="824" dy="16">wired pages</tspan><tspan x="824" dy="16">HEAP grows 2 MiB on fault</tspan><tspan x="824" dy="16">NOEXEC, WB_MMAP</tspan></text></g><g class="Ym9zLnN1cmY= kern"><g class="shape" ><rect x="716" y="290" width="217" height="94" rx="8" stroke="#c5221f" fill="#fce8e6" style="stroke-width:2;" /></g><text x="824.5" y="327.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:15px"><tspan x="824.5" dy="0">IMPORT_IOSURFACE</tspan><tspan x="824.5" dy="16.333333">no copy, plane offset kept</tspan><tspan x="824.5" dy="16.333333">(64-byte pitch required)</tspan></text></g><g class="Ym9zLmFsaWFz ours"><g class="shape" ><rect x="707" y="191" width="235" height="79" rx="8" stroke="#1a73e8" fill="#e8f0fe" style="stroke-width:2;" /></g><text x="824.5" y="228.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:15px"><tspan x="824.5" dy="0">newBufferWithBytesNoCopy</tspan><tspan x="824.5" dy="17">BO alias or tracked copy</tspan></text></g><g class="a2Vybi5jYWNoZQ== kern"><g class="shape" ><rect x="1182" y="201" width="246" height="124" rx="8" stroke="#c5221f" fill="#fce8e6" style="stroke-width:2;" /></g><text x="1305" y="238.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:15px"><tspan x="1305" dy="0">Cache maintenance</tspan><tspan x="1305" dy="15.8">non-WB: write-combined</tspan><tspan x="1305" dy="15.8">WB: invalidated lazily on wait</tspan><tspan x="1305" dy="15.8">GPU caches around each chain</tspan><tspan x="1305" dy="15.8">(flush-ID skipping)</tspan></text></g><g class="a2Vybi5saW0= kern"><g class="shape" ><rect x="1182" y="102" width="234" height="79" rx="8" stroke="#c5221f" fill="#fce8e6" style="stroke-width:2;" /></g><text x="1299" y="139.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:15px"><tspan x="1299" dy="0">Per-process accounting</tspan><tspan x="1299" dy="17">1 GiB per process, 2 GiB total</tspan></text></g><g class="a2Vybi5mYXVsdA== kern"><g class="shape" ><rect x="1182" y="345" width="234" height="109" rx="8" stroke="#c5221f" fill="#fce8e6" style="stroke-width:2;" /></g><text x="1299" y="382.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:15px"><tspan x="1299" dy="0">MMU fault</tspan><tspan x="1299" dy="16">chain fails, its AS is disabled,</tspan><tspan x="1299" dy="16">report of the faulting VA,</tspan><tspan x="1299" dy="16">no GPU reset, never a panic</tspan></text></g><g class="KHByb2MuY3B1IC0mZ3Q7IGJvcy5ibylbMF0="><marker id="mk-d2-3870681872-3488378134" markerWidth="10" markerHeight="12" refX="7" refY="6" viewBox="0 0 10 12" orient="auto" markerUnits="userSpaceOnUse"> <polygon points="0,0 10,6 0,12" fill="#0D32B2" class="connection fill-B1" stroke-width="2" /> </marker><path d="M 380 182.082993 L 472 182.082993 S 482 182.082993 482 172.082993 L 482 108.333 S 482 98.333 492 98.333 L 712 98.333" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-3870681872-3488378134)" mask="url(#d2-3870681872)" /></g><g class="KHByb2MudmEgLSZndDsgYm9zLmJvKVswXQ=="><path d="M 380 294.75 L 657 294.75 S 667 294.75 667 284.75 L 667 144.666 S 667 134.666 677 134.666 L