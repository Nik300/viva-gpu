<!doctype html>
<title>bf</title>
<style>
body { margin: 0; font: 16px sans-serif; background: linear-gradient(90deg, #c33, #3c3, #33c); }
.bg { position: absolute; inset: 0; display: grid; grid-template-columns: repeat(8, 1fr); }
.bg span { font: bold 40px sans-serif; color: #fff; }
.grid { position: relative; display: grid; grid-template-columns: repeat(3, 420px); gap: 30px; padding: 30px; }
.c { height: 180px; border-radius: 28px; padding: 20px; background: rgba(255,255,255,.92); }
.c b { display: block; font-size: 22px; }
.bfs { backdrop-filter: blur(16px) saturate(1.3); }
.bfb { backdrop-filter: blur(16px); }
.sh { box-shadow: rgba(25,65,66,.35) 0 18px 50px; }
.an { animation: a .45s ease; }
@keyframes a { 0% { opacity: 0; transform: translateY(24px); } 100% { opacity: 1; transform: none; } }
</style>
<div class="bg"><span>A</span><span>B</span><span>C</span><span>D</span><span>E</span><span>F</span><span>G</span><span>H</span><span>I</span><span>J</span><span>K</span><span>L</span><span>M</span><span>N</span><span>O</span><span>P</span><span>Q</span><span>R</span><span>S</span><span>T</span><span>U</span><span>V</span><span>W</span><span>X</span><span>Y</span><span>Z</span><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span><span>6</span></div>
<div class="grid">
  <div class="c"><b>1 plain</b>Testo di prova nero</div>
  <div class="c bfb"><b>2 blur</b>Testo di prova nero</div>
  <div class="c bfs"><b>3 blur+saturate</b>Testo di prova nero</div>
  <div class="c bfs sh"><b>4 blur+sat+shadow</b>Testo di prova nero</div>
  <div class="c bfs sh an"><b>5 +animation</b>Testo di prova nero</div>
  <div class="c sh"><b>6 shadow only</b>Testo di prova nero</div>
</div>
