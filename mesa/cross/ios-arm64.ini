# Meson cross file TEMPLATE for iOS 16 arm64 (Mali-G57 / panfrost only).
# NOT tested: needs an iOS SDK (Xcode), which this machine does not have.
#
# Usage (sketch, see README.md "iOS build"):
#   meson setup build-ios src --cross-file cross/ios-arm64.ini \
#     -Dgallium-drivers=panfrost -Dllvm=disabled \
#     -Dmesa-clc=system -Dprecomp-compiler=system ...
# with build-macos/src/compiler/clc/mesa_clc, build-macos/src/compiler/spirv/vtn_bindgen2
# and build-macos/src/panfrost/clc/panfrost_compile (host tools) on PATH.
#
# Replace @IOS_SDK@ with `xcrun --sdk iphoneos --show-sdk-path` and @GPU@ with
# the absolute path of the gpu/ directory.

[constants]
sdk = '@IOS_SDK@'
arch_flags = ['-arch', 'arm64', '-isysroot', sdk, '-mios-version-min=16.0']

[binaries]
c = ['xcrun', '--sdk', 'iphoneos', 'clang']
cpp = ['xcrun', '--sdk', 'iphoneos', 'clang++']
objc = ['xcrun', '--sdk', 'iphoneos', 'clang']
ar = ['xcrun', '--sdk', 'iphoneos', 'ar']
strip = ['xcrun', '--sdk', 'iphoneos', 'strip']
pkg-config = '/opt/homebrew/bin/pkg-config'

[built-in options]
c_args = arch_flags + ['-target', 'arm64-apple-ios16.0', '-g0']
cpp_args = arch_flags + ['-target', 'arm64-apple-ios16.0', '-g0']
c_link_args = arch_flags + ['-target', 'arm64-apple-ios16.0']
cpp_link_args = arch_flags + ['-target', 'arm64-apple-ios16.0']
default_library = 'static'
buildtype = 'release'

[properties]
# Only the target libdrm-xnu (built for arm64-apple-ios16.0) must be visible.
pkg_config_libdir = ['@GPU@/libdrm-xnu/pkgconfig']
needs_exe_wrapper = true

[host_machine]
system = 'darwin'
subsystem = 'ios'
kernel = 'xnu'
cpu_family = 'aarch64'
cpu = 'arm64'
endian = 'little'
